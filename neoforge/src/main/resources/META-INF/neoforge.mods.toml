[[dependencies.roughlyenoughresources]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.roughlyenoughresources]]
modId = "architectury"
mandatory = true
versionRange = "[13.0.6,)"
ordering = "AFTER"
side = "BOTH"